# Install only with the separately approved isolation-capable release.
# A rejected retirement gate leaves the process alive to preserve unresolved
# authentication work. A fixed systemd timeout must not turn that into SIGKILL.
# Tradeoff: an unproven owner can block an unattended stop/reboot. Investigate
# the gate and retain state; never clear the data-directory lock to force a start.
[Service]
TimeoutStopSec=infinity
SendSIGKILL=no
