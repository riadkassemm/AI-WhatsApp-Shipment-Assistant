# Production drop-in for whatsapp-bridge.service
# Install: /etc/systemd/system/whatsapp-bridge.service.d/30-safe-retirement.conf
#          then: systemctl daemon-reload (takes effect at the next stop/restart)
#
# Bounded stop: wait up to 90 s for a graceful shutdown (sockets retire and
# accepted work drains), then SIGKILL. Before 2026-11-09 this was
# TimeoutStopSec=infinity/SendSIGKILL=no because a forced stop fenced every
# number until it was re-paired. Since unclean-exit resume, numbers resume
# their saved sessions after a forced stop, and an unbounded stop only meant a
# frozen bridge could never restart without a human.
[Service]
TimeoutStopSec=90
SendSIGKILL=yes
