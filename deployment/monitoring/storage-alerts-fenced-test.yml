rule_files:
  - storage-alerts.yml
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - {series: support_monitoring_expected, values: '1+0x10'}
      - {series: bridge_watchdog_timestamp_seconds, values: '0+60x10'}
      - {series: bridge_storage_health_level, values: '2+0x10'}
      - {series: support_bridge_eligible_storage_critical, values: '0+0x4 1+0x5'}
      - {series: support_bridge_fenced_lines, values: '1+0x10'}
      - {series: support_bridge_fenced_unresolved_lines, values: '0+0x10'}
    alert_rule_test:
      - {eval_time: 3m, alertname: BridgeStorageUnavailable, exp_alerts: []}
      - {eval_time: 3m, alertname: BridgeIdentityIsolationUnproven, exp_alerts: []}
      - eval_time: 3m
        alertname: BridgeIdentityFenced
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "WhatsApp identity retained offline for authentication review"
              description: "Healthy eligible lines may operate. Retention never authorizes recovery, relinking, fence removal or uncertain resends."
      - eval_time: 8m
        alertname: BridgeStorageUnavailable
        exp_alerts:
          - {exp_labels: {severity: critical}}
  - interval: 1m
    input_series:
      - {series: support_monitoring_expected, values: '1+0x10'}
      - {series: bridge_watchdog_timestamp_seconds, values: '0+60x10'}
      - {series: bridge_storage_health_level, values: '0+0x10'}
    alert_rule_test:
      - eval_time: 3m
        alertname: BridgeStorageUnavailable
        exp_alerts:
          - {exp_labels: {severity: critical}}
      - eval_time: 3m
        alertname: BridgeIdentityIsolationUnproven
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations:
              summary: "Fenced identity lacks safe retirement evidence; do not restart"
