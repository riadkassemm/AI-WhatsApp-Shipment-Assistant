name: Support regression tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  support:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: disposable-test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      OPENAI_API_KEY: unused-test-key
      WHATSAPP_TOKEN: unused-test-token
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_USER: root
      TEST_DB_PASSWORD: disposable-test-password
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
      # Use the runner's native Chrome, not the Chromium snap launcher.
      SUPPORT_TEST_BROWSER: google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Same minor version as the servers' runtime venv (python3.10).
          python-version: '3.10'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: whatsapp_bridge/package-lock.json
      - name: Install audio tools
        run: |
          # The Azure mirror stalled FFmpeg downloads until the job timed out.
          # Keep Ubuntu's signed packages, using its primary archive instead.
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if [ -f "$source" ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$source"
            fi
          done
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: Install a Redis server binary for isolated crash-recovery tests
        run: |
          # tests/integration/test_inbound_queue_durability.py starts its own
          # redis-server (--port 0, private socket) to simulate client loss. Only
          # the binary is needed: block the package's service so it cannot compete
          # with the Redis service container on 127.0.0.1:6379.
          printf '#!/bin/sh\nexit 101\n' | sudo tee /usr/sbin/policy-rc.d >/dev/null
          sudo chmod +x /usr/sbin/policy-rc.d
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends redis-server
          sudo rm -f /usr/sbin/policy-rc.d
          redis-server --version
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci --prefix whatsapp_bridge
      - name: Verify browser dependency
        run: '"$SUPPORT_TEST_BROWSER" --version'
      - name: Syntax and whitespace checks
        run: |
          python -m compileall -q app scripts tests
          git diff --check
          python scripts/check_support_assets.py
          find whatsapp_bridge/src -name '*.js' -exec node --check {} \;
      - name: Unit regressions
        run: python -m pytest --ignore=tests/integration
      - name: Real MariaDB and Redis integration (fresh schema per test)
        # Run even when an earlier suite fails: known UI fixture failures must
        # not hide database and bridge results. The job still fails overall.
        if: ${{ !cancelled() }}
        env:
          SUPPORT_INTEGRATION: '1'
        run: python -m pytest tests/integration
      - name: Bridge regressions (mock WhatsApp)
        if: ${{ !cancelled() }}
        run: npm test --prefix whatsapp_bridge
